<div class="single-sidebar-widget popular-post-widget">
    <h4 class="popular-title">Popular Posts</h4>
    <div class="popular-post-list">
        {% for post in popular_posts %}
        <div class="single-post-list d-flex flex-row align-items-center">
            <div class="thumb">
                <a href="{% url 'blog:blog_single' post.id %}">
                <img class="img-fluid" src="{{ post.image.url }}" alt="{{post.title }}" style="width: 60px; height: 60px; object-fit: cover;" >
                </a>
            </div>
            <div class="details">
                <a href="{% url 'blog:blog_single' post.id %}">
                    <h6>{{ post.title }}</h6>
                </a>
                <p>{{post.counted_view }} views</p>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
