<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>مقالات سایت</title>
</head>
<body>
    <h1>لیست مقالات</h1>
    <hr>
    
    <!-- شروع حلقه روی لیست مقالات ارسالی از view -->
    {% for post in posts %}
        <article style="border: 1px solid #6f24bb; padding: 15px; margin-bottom: 20px;">
            <h2>{{ post.title }}</h2>
            <p><strong>نویسنده:</strong> {{ post.author }} | <strong>دسته‌بندی:</strong> {{ post.category.name }}</p>
            <p><strong>تاریخ:</strong> {{ post.published_date }}</p>
            
            <p><strong>تگ‌ها:</strong> 
                {% for tag in post.tag.all %}
                    <span>#{{ tag.name }}</span>
                {% endfor %}
            </p>
        </article>
    {% empty %}
        <p>در حال حاضر هیچ مقاله‌ای در سیستم ثبت نشده است.</p>
    {% endfor %}
</body>
</html>
